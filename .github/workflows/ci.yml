name: CI

on:
  pull_request:
    branches: [ master ]
  push:
    branches: [ dev ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Unit tests
        run: dotnet test Kitchen.Tests.Unit --no-build --configuration Release

      - name: Integration tests
        run: dotnet test Kitchen.Tests.Integration --no-build --configuration Release

      - name: Install dotnet-ef
        run: |
          dotnet tool install --global dotnet-ef --version 8.0.13
          echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      - name: Check for pending model changes
        env:
          # Placeholder only — this command never opens a real connection, it just
          # compares the current model against the last migration's snapshot file.
          database__ConnectionString: "Host=localhost;Database=KitchenDb;Username=postgres;Password=postgres"
        run: dotnet ef migrations has-pending-model-changes --project Kitchen.Infrastructure --startup-project Kitchen.Api