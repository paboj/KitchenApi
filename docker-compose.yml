services:
  kitchen-api:
    build: .
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - database__ConnectionString=Host=kitchen-db;Database=KitchenDb;Username=postgres;Password=postgres
    depends_on:
      - kitchen-db

  kitchen-db:
    image: postgres:16
    container_name: kitchen-api-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=KitchenDb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: